name: campusguard
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.19.10}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    mem_limit: 2g
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20
    networks: [sentinel]
  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    mem_limit: 512m
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 15s
      timeout: 8s
      retries: 15
    networks: [sentinel]
  redis:
    image: redis:${REDIS_VERSION:-7.4}-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 256m
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sentinel]
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.19.10}
    mem_limit: 1g
    environment:
      LS_JAVA_OPTS: "-Xms384m -Xmx384m"
      XPACK_MONITORING_ENABLED: "false"
    ports: ["127.0.0.1:5000:5000", "127.0.0.1:8088:8088"]
    volumes:
      - ./ingestion/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./ingestion/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./datasets:/data
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20
    networks: [sentinel]
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.19.10}
    mem_limit: 1g
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
      SERVER_SECURITYRESPONSEHEADERS_DISABLEEMBEDDING: "false"
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 25
    networks: [sentinel]
  webapp:
    build: {context: ., dockerfile: app/Dockerfile}
    mem_limit: 384m
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-dev-not-for-production}
      BUS_BACKEND: ${BUS_BACKEND:-redis}
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    depends_on:
      elasticsearch: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 15
    networks: [sentinel]
  kafka:
    profiles: [stream]
    image: apache/kafka:${KAFKA_VERSION:-3.9.1}
    mem_limit: 1024m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 20
    networks: [sentinel]
  filebeat:
    profiles: [stream]
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.19.10}
    mem_limit: 256m
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./ingestion/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./datasets:/data:ro
    depends_on: [logstash]
    networks: [sentinel]
networks:
  sentinel: {driver: bridge}
volumes:
  es-data:
  mongo-data:
  redis-data:
