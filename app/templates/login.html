<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion · Sentinel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/sentinel.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
<div class="lgn">
  <form class="cd" method="post" action="{{ url_for('auth.login', next=next or None) }}">
    <h1 class="login-title">CampusGuard · Sentinel</h1>
    <p class="sub">Connexion à la plateforme de laboratoire. Les comptes sont créés par un administrateur.</p>
    {% if error %}<div class="alert err" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Nom d’utilisateur</label>
    <input class="in" id="username" name="username" autocomplete="username" required autofocus maxlength="64">
    <label for="password">Mot de passe</label>
    <input class="in" id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn p" type="submit">Se connecter</button>
    <p class="sub small">Environnement de laboratoire : n’exposez pas cette instance sur Internet.</p>
  </form>
</div>
</body>
</html>
