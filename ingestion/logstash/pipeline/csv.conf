input {
  file { path => "/data/samples/firewall.csv" start_position => "beginning" sincedb_path => "/tmp/firewall.sincedb" mode => "read" codec => plain add_field => { "[@metadata][kind]" => "firewall" } }
}
filter {
  csv { source => "message" separator => "," columns => ["timestamp","ip","action","port","level"] skip_header => true }
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" tag_on_failure => ["_bad_timestamp"] }
  mutate { add_field => { "[event][category]" => "network" "[service][name]" => "firewall" "[source][ip]" => "%{ip}" "[event][action]" => "%{action}" "[log][level]" => "%{level}" } }
  mutate { convert => { "port" => "integer" } }
  mutate { rename => { "port" => "[destination][port]" } remove_field => ["ip", "action", "level", "timestamp", "host", "path"] }
  geoip { source => "[source][ip]" target => "[source][geo]" tag_on_failure => ["_geoip_lookup_failure"] }
}
output {
  if "_csvparsefailure" in [tags] or "_bad_timestamp" in [tags] {
    file { path => "/data/rejected/csv-dead-letter.jsonl" codec => json_lines }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "logs-firewall-%{+YYYY.MM.dd}" }
  }
}
