input {
  file {
    path => "/data/samples/firewall.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/firewall.sincedb"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/firewall-completed.log"
    codec => plain
    add_field => { "[@metadata][kind]" => "firewall" }
  }
}
filter {
  csv { source => "message" separator => "," columns => ["timestamp","ip","action","port","level"] skip_header => true }

  if ![timestamp] or [timestamp] == "" {
    mutate { add_tag => ["_missing_timestamp"] }
  } else {
    date { match => ["timestamp", "ISO8601"] target => "@timestamp" tag_on_failure => ["_bad_timestamp"] }
  }
  if ![ip] or [ip] == "" { mutate { add_tag => ["_missing_source_ip"] } }
  if ![action] or [action] == "" { mutate { add_tag => ["_missing_event_action"] } }
  if ![port] or [port] == "" { mutate { add_tag => ["_missing_destination_port"] } }
  if ![level] or [level] == "" { mutate { add_tag => ["_missing_log_level"] } }

  mutate { add_field => { "[event][category]" => "network" "[service][name]" => "firewall" "[source][ip]" => "%{ip}" "[event][action]" => "%{action}" "[log][level]" => "%{level}" } }
  mutate { lowercase => ["[event][action]"] }

  if [source][ip] and [source][ip] != "" {
    grok { match => { "[source][ip]" => "^%{IP}$" } tag_on_failure => ["_invalid_source_ip"] }
  }
  if [event][action] and [event][action] !~ /^(allow|deny)$/ {
    mutate { add_tag => ["_invalid_event_action"] }
  }
  if [port] and [port] != "" {
    if [port] !~ /^\d+$/ {
      mutate { add_tag => ["_invalid_destination_port"] }
    } else {
      mutate { convert => { "port" => "integer" } }
      if [port] < 1 or [port] > 65535 {
        mutate { add_tag => ["_invalid_destination_port"] }
      }
    }
  }

  mutate { rename => { "port" => "[destination][port]" } remove_field => ["ip", "action", "level", "timestamp", "host", "path"] }
  if [source][ip] and "_invalid_source_ip" not in [tags] {
    geoip { source => "[source][ip]" target => "[source]" tag_on_failure => ["_geoip_lookup_failure"] }
  }
  fingerprint {
    source => ["[@timestamp]", "[source][ip]", "[event][action]", "[destination][port]", "[log][level]", "message"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][document_id]"
  }
}
output {
  if "_csvparsefailure" in [tags] or
     "_missing_timestamp" in [tags] or
     "_bad_timestamp" in [tags] or
     "_missing_source_ip" in [tags] or
     "_invalid_source_ip" in [tags] or
     "_missing_event_action" in [tags] or
     "_invalid_event_action" in [tags] or
     "_missing_destination_port" in [tags] or
     "_invalid_destination_port" in [tags] or
     "_missing_log_level" in [tags] {
    file { path => "/data/rejected/csv-dead-letter.jsonl" codec => json_lines }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-firewall-%{+YYYY.MM.dd}"
      manage_template => false
      document_id => "%{[@metadata][document_id]}"
    }
  }
}
