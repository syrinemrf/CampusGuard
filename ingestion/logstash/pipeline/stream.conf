# Flux continu (S5, module H) : lignes syslog brutes de sshd, comme celles d'un vrai serveur.
#
#   fichier /var/log/... → Filebeat (tail) → Kafka (topic logs.auth) → ce pipeline → Elasticsearch + Redis Pub/Sub
#   ou, sans Kafka :      scripts/replay_openssh.py --to tcp → port 5140 → ce pipeline
#
# Le parsing est fait ici (grok + règles explicites) : Logstash reçoit le texte tel que sshd l'écrit.
# Une tentative SSH produit plusieurs lignes (Invalid user, pam_unix, Failed password) : seule la ligne
# « Failed password » compte comme un échec, sinon une tentative serait comptée trois fois par les règles.
input {
  kafka {
    id => "kafka_logs_auth"
    bootstrap_servers => "${KAFKA_BOOTSTRAP:kafka:9092}"
    topics => ["logs.auth"]
    group_id => "logstash-sentinel"
    client_id => "logstash-sentinel"
    auto_offset_reset => "latest"
    codec => plain { charset => "UTF-8" }
    reconnect_backoff_ms => 10000
    add_field => { "[@metadata][transport]" => "kafka" }
  }
  tcp {
    id => "tcp_raw_syslog"
    port => 5140
    codec => line { charset => "UTF-8" }
    add_field => { "[@metadata][transport]" => "tcp" }
  }
}
filter {
  grok {
    id => "syslog_line"
    match => { "message" => "^%{TIMESTAMP_ISO8601:[@metadata][ts]} %{SYSLOGHOST:[host][hostname]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: %{GREEDYDATA:[@metadata][msg]}$" }
    tag_on_failure => ["_unparsed_syslog"]
  }
  if "_unparsed_syslog" not in [tags] {
    date { match => ["[@metadata][ts]", "ISO8601"] target => "@timestamp" tag_on_failure => ["_bad_timestamp"] }
    ruby {
      id => "sshd_classify"
      code => "
        m = event.get('[@metadata][msg]').to_s
        ip_re = '(\d{1,3}(?:\.\d{1,3}){3})'
        action, outcome, level, user, ip = 'ssh-other', 'unknown', 'INFO', nil, nil
        if (r = m.match(/^Failed (?:password|none|publickey) for (?:invalid user )?(.*?) from #{ip_re} port \d+/))
          action, outcome, level, user, ip = 'ssh-login', 'failure', 'WARNING', r[1], r[2]
        elsif (r = m.match(/^message repeated (\d+) times: \[ Failed (?:password|none) for (?:invalid user )?(.*?) from #{ip_re}/))
          action, outcome, level, user, ip = 'ssh-login', 'failure', 'WARNING', r[2], r[3]
          event.set('[event][count]', r[1].to_i)
        elsif (r = m.match(/^Accepted (?:password|publickey|keyboard-interactive\S*) for (\S+) from #{ip_re} port \d+/))
          action, outcome, level, user, ip = 'ssh-login', 'success', 'INFO', r[1], r[2]
        elsif (r = m.match(/^Invalid user (.*?) from #{ip_re}/))
          action, level, user, ip = 'ssh-invalid-user', 'WARNING', r[1], r[2]
        elsif (r = m.match(/^reverse mapping checking getaddrinfo for \S+ \[#{ip_re}\] failed - POSSIBLE BREAK-IN ATTEMPT/))
          action, level, ip = 'ssh-reverse-mapping', 'WARNING', r[1]
        elsif (r = m.match(/authentication failures?;.*rhost=(\S+)(?:\s+user=(\S+))?/))
          action, level, user = 'pam-auth-failure', 'WARNING', r[2]
          ip = r[1] if r[1].match?(/\A#{ip_re}\z/)
        elsif (r = m.match(/^Disconnecting: Too many authentication failures(?: for (\S+))?/))
          action, level, user = 'ssh-too-many-failures', 'ERROR', r[1]
        elsif m.start_with?('error:') || m.start_with?('fatal:')
          action, level = 'ssh-error', (m.start_with?('fatal:') ? 'CRITICAL' : 'ERROR')
        elsif (r = m.match(/^(?:Received disconnect|Connection closed|Disconnected) (?:from|by) #{ip_re}/))
          action, ip = 'ssh-disconnect', r[1]
        end
        ip ||= (r = m.match(/(?<![\d.])#{ip_re}(?![\d.])/)) ? r[1] : nil
        event.set('[event][action]', action)
        event.set('[event][outcome]', outcome)
        event.set('[event][category]', action == 'ssh-login' ? 'authentication' : 'network')
        event.set('[log][level]', level)
        user = user.strip if user
        event.set('[user][name]', user) if user && !user.empty?
        event.set('[source][ip]', ip) if ip
        event.set('[service][name]', 'openssh')
        event.set('[labels][provenance]', 'stream')
        event.set('[labels][transport]', event.get('[@metadata][transport]'))
        event.set('message', m)
      "
      tag_on_exception => "_sshd_classify_error"
    }
    if [source][ip] {
      grok { match => { "[source][ip]" => "^%{IP}$" } tag_on_failure => ["_invalid_source_ip"] }
      if "_invalid_source_ip" not in [tags] {
        geoip { source => "[source][ip]" target => "[source]" tag_on_failure => ["_geoip_lookup_failure"] }
      }
    }
    # Latence : temps entre l'écriture de la ligne (horodatage syslog) et son passage dans Logstash.
    ruby {
      code => "
        now = Time.now.utc
        event.set('[event][ingested]', now.strftime('%Y-%m-%dT%H:%M:%S.%LZ'))
        ts = event.get('@timestamp')
        event.set('[event][ingest_lag_ms]', ((now.to_f - ts.to_f) * 1000).round) if ts
      "
    }
  }
  mutate { remove_field => ["[event][original]", "@version"] }
}
output {
  if "_unparsed_syslog" in [tags] or "_bad_timestamp" in [tags] or "_sshd_classify_error" in [tags] {
    file { path => "/data/rejected/stream-dead-letter.jsonl" codec => json_lines }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-ssh-%{+YYYY.MM.dd}"
      manage_template => false
    }
    # Publié après l'indexation : la page « Temps réel » ne montre que ce qui est déjà cherchable.
    redis {
      host => "redis"
      data_type => "channel"
      key => "sentinel:live:logs"
      codec => json
    }
  }
}
