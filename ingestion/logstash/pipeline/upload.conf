# Files validated and normalised by the web application (app/services/parsing.py) are handed over as
# NDJSON in /data/uploads/ready/<upload_id>.ndjson (written under a temporary name, then renamed).
# This pipeline is the second line of validation + the indexer: it never trusts the app blindly.
#
# Rejected events go to /data/rejected/upload-<upload_id>.ndjson, which the web application counts to
# report "partiel"/"échec". Indexed events are counted in Elasticsearch on labels.upload_id.
input {
  file {
    id => "upload_ready_files"
    path => "/data/uploads/ready/*.ndjson"
    mode => "read"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/upload.sincedb"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/upload-completed.log"
    discover_interval => 2
    stat_interval => "1 second"
    codec => json
    add_field => { "[@metadata][kind]" => "upload" }
  }
}
filter {
  ruby {
    code => "
      invalid = []
      invalid << 'timestamp' unless event.get('timestamp').is_a?(String)
      invalid << 'message' unless event.get('message').is_a?(String)
      %w[source user event log service destination labels].each do |path|
        value = event.get(path)
        invalid << path unless value.nil? || value.is_a?(Hash)
      end
      ip = event.get('[source][ip]')
      invalid << '[source][ip]' unless ip.nil? || ip.is_a?(String)
      port = event.get('[destination][port]')
      invalid << '[destination][port]' unless port.nil? || (port.is_a?(Integer) && port.between?(1, 65535))
      line = event.get('[log][origin][file][line]')
      invalid << '[log][origin][file][line]' unless line.is_a?(Integer) && line > 0
      uid = event.get('[labels][upload_id]')
      uid_ok = uid.is_a?(String) && uid.length == 32 && !uid.match?(/[^0-9a-f]/)
      invalid << '[labels][upload_id]' unless uid_ok
      ['[event][action]', '[event][outcome]', '[event][category]', '[log][level]', '[service][name]'].each do |path|
        invalid << path unless event.get(path).is_a?(String)
      end
      invalid << '[user][name]' unless event.get('[user][name]').nil? || event.get('[user][name]').is_a?(String)
      event.tag('_invalid_field_type') unless invalid.empty?
    "
    tag_on_exception => "_invalid_field_type"
  }

  if "_invalid_field_type" not in [tags] and "_jsonparsefailure" not in [tags] {
    date { match => ["timestamp", "ISO8601"] target => "@timestamp" tag_on_failure => ["_bad_timestamp"] }

    if [source][ip] {
      grok { match => { "[source][ip]" => "^%{IP}$" } tag_on_failure => ["_invalid_source_ip"] }
    }
    if [event][outcome] !~ /^(success|failure|unknown)$/ {
      mutate { add_tag => ["_invalid_event_outcome"] }
    }
    if [event][action] !~ /^[A-Za-z0-9._-]+$/ {
      mutate { add_tag => ["_invalid_event_action"] }
    }
    if [log][level] !~ /^(DEBUG|INFO|WARNING|ERROR|CRITICAL)$/ {
      mutate { add_tag => ["_invalid_log_level"] }
    }

    mutate { remove_field => ["[source][geo]"] }
    if [source][ip] and "_invalid_source_ip" not in [tags] {
      geoip { source => "[source][ip]" target => "[source]" tag_on_failure => ["_geoip_lookup_failure"] }
    }
    ruby { code => "event.set('[event][ingested]', Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%LZ'))" }
    # One document per (upload, line): re-reading the same file can never create duplicates.
    fingerprint {
      source => ["[labels][upload_id]", "[log][origin][file][line]"]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][document_id]"
    }
    mutate { remove_field => ["timestamp", "host", "[log][file]"] }
  }
}
output {
  if "_jsonparsefailure" in [tags] or "_invalid_field_type" in [tags] or "_rubyexception" in [tags] {
    # upload_id cannot be trusted here: never use it to build a file name.
    file { path => "/data/rejected/upload-unknown.ndjson" codec => json_lines }
  } else if "_bad_timestamp" in [tags] or
            "_invalid_source_ip" in [tags] or
            "_invalid_event_outcome" in [tags] or
            "_invalid_event_action" in [tags] or
            "_invalid_log_level" in [tags] {
    file { path => "/data/rejected/upload-%{[labels][upload_id]}.ndjson" codec => json_lines }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-upload-%{+YYYY.MM.dd}"
      manage_template => false
      document_id => "%{[@metadata][document_id]}"
    }
  }
}
