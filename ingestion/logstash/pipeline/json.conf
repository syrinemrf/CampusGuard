input {
  beats { port => 5044 add_field => { "[@metadata][kind]" => "beats" } }
  file {
    path => "/data/samples/auth.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/auth.sincedb"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/auth-completed.log"
    codec => json
    add_field => { "[@metadata][kind]" => "auth" }
  }
  http { port => 8088 codec => json add_field => { "[@metadata][kind]" => "webhook" } }
  tcp { port => 5000 codec => json_lines add_field => { "[@metadata][kind]" => "tcp" } }
}
filter {
  ruby {
    code => "
      scalar_paths = [
        'timestamp', 'source_ip', 'username', 'outcome', 'action', 'level',
        'message'
      ]
      invalid_paths = scalar_paths.select do |path|
        value = event.get(path)
        !value.nil? && !value.is_a?(String)
      end

      container_paths = [
        'source', 'user', 'event', 'log', 'service', 'labels', 'rule',
        'destination', 'threat'
      ]
      invalid_paths.concat(container_paths.select do |path|
        value = event.get(path)
        !value.nil? && !value.is_a?(Hash)
      end)

      if invalid_paths.empty?
        nested_container_paths = [
          '[source][geo]', '[threat][technique]'
        ]
        invalid_paths.concat(nested_container_paths.select do |path|
          value = event.get(path)
          !value.nil? && !value.is_a?(Hash)
        end)
      end

      if invalid_paths.empty?
        nested_scalar_paths = [
          '[source][ip]', '[user][name]', '[event][outcome]',
          '[event][action]', '[log][level]', '[service][name]',
          '[labels][ground_truth]', '[rule][name]',
          '[threat][technique][id]'
        ]
        invalid_paths.concat(nested_scalar_paths.select do |path|
          value = event.get(path)
          !value.nil? && !value.is_a?(String)
        end)

        category = event.get('[event][category]')
        category_valid = category.nil? || category.is_a?(String) ||
          (category.is_a?(Array) && category.all? { |value| value.is_a?(String) })
        invalid_paths << '[event][category]' unless category_valid

        port = event.get('[destination][port]')
        port_valid = port.nil? ||
          (port.is_a?(Integer) && port.between?(1, 65535)) ||
          (port.is_a?(String) && port.match?(/^[0-9]+$/) &&
            port.to_i.between?(1, 65535))
        invalid_paths << '[destination][port]' unless port_valid
      end

      unless invalid_paths.empty?
        event.tag('_invalid_field_type')
      end
    "
    tag_on_exception => "_invalid_field_type"
  }

  if "_invalid_field_type" not in [tags] {
    if ![timestamp] or [timestamp] == "" {
      mutate { add_tag => ["_missing_timestamp"] }
    } else {
      date { match => ["timestamp", "ISO8601"] target => "@timestamp" tag_on_failure => ["_bad_timestamp"] }
    }

    if [source_ip] { mutate { rename => { "source_ip" => "[source][ip]" } } }
    if [username] { mutate { rename => { "username" => "[user][name]" } } }
    if [outcome] { mutate { rename => { "outcome" => "[event][outcome]" } } }
    if [action] { mutate { rename => { "action" => "[event][action]" } } }
    if [level] { mutate { rename => { "level" => "[log][level]" } } }

    if ![service][name] { mutate { add_field => { "[service][name]" => "authentication" } } }
    if ![log][level] { mutate { add_field => { "[log][level]" => "INFO" } } }
    if ![event][category] { mutate { add_field => { "[event][category]" => "authentication" } } }
    if ![event][action] or [event][action] == "" { mutate { add_field => { "[event][action]" => "login" } } }
    mutate { lowercase => ["[event][action]", "[event][outcome]"] }

    if ![source][ip] or [source][ip] == "" {
      mutate { add_tag => ["_missing_source_ip"] }
    } else {
      grok { match => { "[source][ip]" => "^%{IP}$" } tag_on_failure => ["_invalid_source_ip"] }
    }
    if ![event][outcome] or [event][outcome] == "" {
      mutate { add_tag => ["_missing_event_outcome"] }
    } else if [event][outcome] !~ /^(success|failure|unknown)$/ {
      mutate { add_tag => ["_invalid_event_outcome"] }
    }
    if [event][action] !~ /^[A-Za-z0-9._-]+$/ {
      mutate { add_tag => ["_invalid_event_action"] }
    }
    if ![message] or [message] == "" {
      mutate { add_tag => ["_missing_message"] }
    }

    mutate { remove_field => ["[source][geo]"] }
    if [source][ip] and "_invalid_source_ip" not in [tags] {
      geoip { source => "[source][ip]" target => "[source]" tag_on_failure => ["_geoip_lookup_failure"] }
    }
    fingerprint {
      source => ["[@timestamp]", "[source][ip]", "[user][name]", "[service][name]", "[event][action]", "[event][outcome]", "message"]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][document_id]"
    }
    mutate { remove_field => ["timestamp", "headers", "host"] }
  }
}
output {
  if "_jsonparsefailure" in [tags] or
     "_invalid_field_type" in [tags] or
     "_rubyexception" in [tags] or
     "_missing_timestamp" in [tags] or
     "_bad_timestamp" in [tags] or
     "_missing_source_ip" in [tags] or
     "_invalid_source_ip" in [tags] or
     "_missing_event_outcome" in [tags] or
     "_invalid_event_outcome" in [tags] or
     "_invalid_event_action" in [tags] or
     "_missing_message" in [tags] {
    file { path => "/data/rejected/json-dead-letter.jsonl" codec => json_lines }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-auth-%{+YYYY.MM.dd}"
      manage_template => false
      document_id => "%{[@metadata][document_id]}"
    }
  }
}
