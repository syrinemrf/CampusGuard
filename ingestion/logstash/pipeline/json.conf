input {
  beats { port => 5044 add_field => { "[@metadata][kind]" => "beats" } }
  file { path => "/data/samples/auth.jsonl" start_position => "beginning" sincedb_path => "/tmp/auth.sincedb" mode => "read" codec => json_lines add_field => { "[@metadata][kind]" => "auth" } }
  http { port => 8088 codec => json add_field => { "[@metadata][kind]" => "webhook" } }
  tcp { port => 5000 codec => json_lines add_field => { "[@metadata][kind]" => "tcp" } }
}
filter {
  if [timestamp] {
    date { match => ["timestamp", "ISO8601"] target => "@timestamp" tag_on_failure => ["_bad_timestamp"] }
  }
  if [source_ip] { mutate { rename => { "source_ip" => "[source][ip]" } } }
  if [username] { mutate { rename => { "username" => "[user][name]" } } }
  if [outcome] { mutate { rename => { "outcome" => "[event][outcome]" } } }
  if [level] { mutate { rename => { "level" => "[log][level]" } } }
  if ![service][name] { mutate { add_field => { "[service][name]" => "authentication" } } }
  if ![log][level] { mutate { add_field => { "[log][level]" => "INFO" } } }
  if ![event][category] { mutate { add_field => { "[event][category]" => "authentication" } } }
  if [source][ip] { geoip { source => "[source][ip]" target => "[source][geo]" tag_on_failure => ["_geoip_lookup_failure"] } }
  mutate { remove_field => ["timestamp", "headers", "host"] }
}
output {
  if "_jsonparsefailure" in [tags] or "_bad_timestamp" in [tags] {
    file { path => "/data/rejected/json-dead-letter.jsonl" codec => json_lines }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "logs-auth-%{+YYYY.MM.dd}" }
  }
}
